<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Hide Spoilers</h1>
    <p class="site-status" id="siteStatus"></p>

    <label class="row">
      <input type="checkbox" id="hideTitle" />
      Hide problem title
    </label>
    <label class="row">
      <input type="checkbox" id="hideDifficulty" />
      Hide difficulty
    </label>
    <label class="row">
      <input type="checkbox" id="hideTopics" />
      Hide topics
    </label>
    <label class="row">
      <input type="checkbox" id="hideAcceptance" />
      Hide acceptance rate
    </label>

    <p class="hint">Hover a blurred item to peek, or click it to keep it revealed.</p>
    <script src="popup.js"></script>
  </body>
</html>
